<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Franca Pastas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF9F4; --surface:#fff; --surface-2:#EAF2F6; --ink:#17333F; --ink-soft:#5A7680;
    --blue:#2E7EB0; --blue-deep:#1F5F8C; --navy:#17333F; --line:#E5E7DC;
    --gold:#E8A33D; --basil:#6B8F4E; --red:#D14C33;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Titillium Web','Arial Narrow',system-ui,sans-serif;font-size:16px;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  .top{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10;}
  .top h1{margin:0;font-size:1.05rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;}
  .top a,.top button{color:#fff;background:transparent;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.8rem;cursor:pointer;text-decoration:none;}
  .wrap{max-width:1240px;margin:0 auto;padding:20px 16px 110px;}
  .login{max-width:360px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;}
  .login h2{margin:0 0 4px;font-weight:900;color:var(--blue);}
  .login p{margin:0 0 18px;color:var(--ink-soft);font-size:.9rem;}
  label{display:block;font-weight:700;font-size:.8rem;margin:12px 0 4px;}
  input[type=text],input[type=email],input[type=password],input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;}
  .btn:hover{background:var(--blue-deep);} .btn:disabled{opacity:.5;cursor:default;}
  .btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue);}
  .btn.danger{background:var(--red);} .btn.small{padding:6px 14px;font-size:.8rem;}
  .err{color:var(--red);font-weight:700;font-size:.85rem;margin-top:10px;min-height:1.2em;}
  #tab-orders,#tab-stats{max-width:900px;margin:0 auto;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer;}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
  h3{margin:0 0 10px;font-weight:900;}
  .cat-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px;}
  .cat-h h3{color:var(--blue);margin:0;}
  .pgrid-wrap{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 22px -16px rgba(23,51,63,.35);transition:box-shadow .15s,border-color .15s;}
  .pcard.dirty{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,163,61,.25);}
  .pphoto{position:relative;display:block;width:100%;aspect-ratio:4/3;border:none;padding:0;cursor:pointer;background:var(--surface-2);}
  .pphoto{overflow:hidden;}
  .pphoto img,.pphoto .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .pphoto .ph{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:3rem;color:rgba(255,255,255,.85);}
  .pchange{position:absolute;left:10px;bottom:10px;background:rgba(23,51,63,.85);color:#fff;font-weight:700;font-size:.8rem;padding:6px 14px;border-radius:999px;}
  .pchips{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;}
  .chip{background:var(--navy);color:#fff;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px;}
  .chip.warn{background:var(--red);} .chip.gold{background:var(--gold);} .chip.grey{background:var(--ink-soft);}
  .pbody{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .pname{font-size:1.25rem !important;font-weight:900 !important;color:var(--blue);border:1px solid transparent !important;padding:6px 8px !important;background:transparent !important;}
  .pname:hover,.pname:focus{border-color:var(--line) !important;background:#fff !important;}
  .pdesc{color:var(--ink-soft);border:1px solid transparent !important;padding:6px 8px !important;background:transparent !important;}
  .pdesc:hover,.pdesc:focus{border-color:var(--line) !important;background:#fff !important;}
  .pnums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pnums label{margin:0 0 4px;font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .pnums input{font-size:1.15rem;font-weight:700;padding:12px;}
  .pfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px;}
  .sw{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;margin:0;font-size:.9rem;}
  .sw input{width:20px;height:20px;accent-color:var(--basil);}
  .pfoot .grow{flex:1;}
  .pcard.off .pphoto{filter:grayscale(1);opacity:.55;}
  .chead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:26px 0 10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;scroll-margin-top:120px;}
  .chead.dirty{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,163,61,.25);}
  .chead input,.chead select{width:auto;padding:8px 12px;}
  .chead .ctitle{font-size:1.25rem;font-weight:900;color:var(--blue);min-width:0;flex:1 1 200px;border-color:transparent;background:transparent;}
  .chead .ctitle:hover,.chead .ctitle:focus{border-color:var(--line);background:#fff;}
  .chead .cnote{flex:0 1 190px;} .chead .cact{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;}
  .chead .cnt{color:var(--ink-soft);font-size:.85rem;margin-right:6px;}
  .cat-nav{position:sticky;top:56px;z-index:9;background:var(--bg);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);margin-bottom:6px;}
  .cat-nav a{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;color:var(--ink);text-decoration:none;}
  .cat-nav a:hover{border-color:var(--blue);color:var(--blue);}
  .cat-nav input{max-width:220px;margin-left:auto;padding:8px 14px;border-radius:999px;}
  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:flex-end;gap:12px;box-shadow:0 -8px 24px -10px rgba(0,0,0,.35);}
  .savebar #save-count{margin-right:auto;font-weight:700;}
  .savebar .btn{padding:12px 26px;font-size:1rem;} .savebar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.6);padding:8px 16px;font-size:.85rem;}
  .savebar.has{background:var(--gold);color:var(--navy);} .savebar.has .btn:not(.ghost){background:var(--navy);color:#fff;} .savebar.has .btn.ghost{color:var(--navy);border-color:var(--navy);}
  .pbtns{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;}
  .pbtns button{background:rgba(23,51,63,.88);color:#fff;border:none;font-weight:700;font-size:.8rem;padding:7px 14px;border-radius:999px;cursor:pointer;}
  .pbtns button:hover{background:var(--blue);}
  .pmedia{position:absolute;inset:0;}
  .modal{position:fixed;inset:0;background:rgba(23,51,63,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal-box{background:#fff;border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:94vh;overflow:auto;}
  .modal-box h3{margin:0 0 4px;} .mp{margin:0 0 12px;color:var(--ink-soft);font-size:.9rem;}
  .fwrap{position:relative;display:block;width:fit-content;max-width:100%;margin:0 auto;touch-action:none;cursor:crosshair;background:var(--surface-2);border-radius:8px;overflow:hidden;line-height:0;}
  .fwrap img{width:auto;height:auto;max-width:100%;max-height:52vh;display:block;}
  #fdot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px var(--blue),0 2px 8px rgba(0,0,0,.5);pointer-events:none;background:rgba(46,126,176,.25);}
  .fprev{display:flex;gap:16px;margin:14px 0;align-items:flex-end;} .fprev small{display:block;color:var(--ink-soft);font-weight:700;margin-bottom:4px;font-size:.75rem;}
  .pv{overflow:hidden;border-radius:8px;background:var(--surface-2);} .pv img{width:100%;height:100%;object-fit:cover;display:block;}
  .pv.sq{width:120px;aspect-ratio:1/1;} .pv.r43{width:160px;aspect-ratio:4/3;}
  .macts{display:flex;gap:10px;justify-content:flex-end;}
  .saved{color:var(--basil);font-weight:700;font-size:.8rem;}
  .off{opacity:.55;}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#fff;}
  .pill.nuevo{background:var(--gold);} .pill.confirmado{background:var(--basil);} .pill.cancelado{background:var(--ink-soft);}
  .order-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;}
  .order ul{margin:8px 0;padding-left:18px;color:var(--ink-soft);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .kpi b{display:block;font-size:1.6rem;font-weight:900;color:var(--blue);}
  .kpi span{color:var(--ink-soft);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
  .bar{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:.85rem;}
  .bar .l{width:92px;flex:none;color:var(--ink-soft);} .bar .t{flex:1;background:var(--surface-2);border-radius:99px;height:14px;overflow:hidden;}
  .bar .t i{display:block;height:100%;background:var(--blue);border-radius:99px;} .bar .v{width:96px;flex:none;text-align:right;font-weight:700;}
  .bar .l.wide{width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
  .hidden{display:none !important;}
  .filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  @media (max-width:520px){.bar .l.wide{width:110px;}.bar .v{width:76px;}}
</style>
</head>
<body>

<div id="login-view" class="login">
  <h2>Franca Pastas</h2>
  <p>Ingresá con tu usuario de administrador.</p>
  <form id="login-form">
    <label for="em">Email</label><input type="email" id="em" autocomplete="username" required>
    <label for="pw">Contraseña</label><input type="password" id="pw" autocomplete="current-password" required>
    <div class="err" id="login-err"></div>
    <button class="btn" type="submit" style="width:100%;margin-top:6px;">Entrar</button>
  </form>
</div>

<div id="app-view" class="hidden">
  <div class="top"><h1>Admin · Franca</h1><div style="display:flex;gap:8px;"><a href="index.html" target="_blank">Ver sitio</a><button id="logout">Salir</button></div></div>
  <div class="wrap">
    <div class="tabs">
      <button class="tab on" data-tab="catalog">Catálogo</button>
      <button class="tab" data-tab="orders">Pedidos</button>
      <button class="tab" data-tab="stats">Estadísticas</button>
    </div>
    <div id="tab-orders" class="hidden"></div>
    <div id="tab-catalog"></div>
    <div id="tab-stats" class="hidden"></div>
  </div>
</div>

<div id="savebar" class="savebar hidden">
  <span id="save-count">Sin cambios pendientes</span>
  <button class="btn ghost small hidden" id="discard">Descartar</button>
  <button class="btn" id="save-all" disabled>Guardar todos los cambios</button>
</div>

<div id="focus-modal" class="modal hidden">
  <div class="modal-box">
    <h3>Encuadrá la foto</h3>
    <p class="mp">Tocá o arrastrá sobre la foto para elegir qué parte se ve. Abajo ves cómo queda.</p>
    <div class="fwrap" id="fwrap"><img id="fimg" alt=""><span id="fdot"></span></div>
    <div class="fprev">
      <div><small>En el menú</small><div class="pv sq"><img id="pv1" alt=""></div></div>
      <div><small>Al abrir el plato</small><div class="pv r43"><img id="pv2" alt=""></div></div>
    </div>
    <div class="macts"><button class="btn ghost" id="f-cancel">Cancelar</button><button class="btn" id="f-ok">Listo</button></div>
  </div>
</div>

<input type="file" id="file-input" accept="image/*" class="hidden">

<script>
(function(){
  var SUPA = "https://utlqzvgjudbmaphmsouk.supabase.co";
  var KEY = "sb_publishable_Fl81X6B3irrEVdZigJj3ag_kGBN83PU";
  var SESSION_KEY = "franca_admin_session";
  var session = null;
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch(e){}

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function money(n){ return "$" + Number(n || 0).toLocaleString("es-AR"); }
  function saveSession(s){ session = s; try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch(e){} }

  /* ---------- auth + api ---------- */
  function authRequest(grant, body){
    return fetch(SUPA + "/auth/v1/token?grant_type=" + grant, {method:"POST", headers:{apikey:KEY, "Content-Type":"application/json"}, body: JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error_description || j.msg || "Error de acceso"); return j; }); });
  }
  function storeTokens(j){ saveSession({access:j.access_token, refresh:j.refresh_token, email:(j.user && j.user.email) || (session && session.email)}); }
  function refresh(){
    if (!session || !session.refresh) return Promise.reject(new Error("sin sesion"));
    return authRequest("refresh_token", {refresh_token: session.refresh}).then(storeTokens);
  }
  function api(path, opts, retry){
    opts = opts || {};
    opts.headers = Object.assign({apikey:KEY, Authorization:"Bearer " + (session ? session.access : ""), "Content-Type":"application/json"}, opts.headers || {});
    return fetch(SUPA + path, opts).then(function(r){
      if ((r.status === 401 || r.status === 403) && !retry && session && session.refresh){
        return refresh().then(function(){ opts.headers.Authorization = "Bearer " + session.access; return api(path, opts, true); });
      }
      if (!r.ok) return r.text().then(function(t){ throw new Error(t || ("http " + r.status)); });
      return r.status === 204 ? null : r.text().then(function(t){ return t ? JSON.parse(t) : null; });
    });
  }
  function rest(path, opts){ return api("/rest/v1/" + path, opts); }

  $("login-form").addEventListener("submit", function(e){
    e.preventDefault();
    $("login-err").textContent = "";
    authRequest("password", {email: $("em").value.trim(), password: $("pw").value}).then(function(j){
      storeTokens(j);
      return checkAdmin();
    }).catch(function(err){ $("login-err").textContent = err.message === "Invalid login credentials" ? "Email o contraseña incorrectos." : err.message; });
  });
  $("logout").addEventListener("click", function(){ try { localStorage.removeItem(SESSION_KEY); } catch(e){} location.reload(); });

  function checkAdmin(){
    return rest("admins?select=user_id").then(function(rows){
      if (!rows || !rows.length) throw new Error("Este usuario no tiene permisos de administrador.");
      $("login-view").classList.add("hidden");
      $("app-view").classList.remove("hidden");
      showTab("catalog");
    });
  }

  /* ---------- tabs ---------- */
  var CATS = [], PRODS = [];
  var SHAPE_OPTS = [["dome","Cúpula (sorrentinos, tortellonis)"],["star","Estrella (ravioles, panzottis)"],["roll","Rollo (canelones)"],["strand","Fideos"],["gnocco","Ñoqui"]];
  function slug(t){ return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
  document.querySelectorAll(".tab").forEach(function(t){ t.addEventListener("click", function(){ showTab(t.dataset.tab); }); });
  function showTab(name){
    document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("on", t.dataset.tab === name); });
    ["orders","catalog","stats"].forEach(function(n){ $("tab-" + n).classList.toggle("hidden", n !== name); });
    $("savebar").classList.toggle("hidden", name !== "catalog");
    if (name === "orders") loadOrders();
    if (name === "catalog") loadCatalog();
    if (name === "stats") loadStats();
  }

  /* ---------- orders ---------- */
  var orderFilter = "nuevo";
  function fmtDate(iso){
    return new Date(iso).toLocaleString("es-AR", {timeZone:"America/Argentina/Buenos_Aires", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
  }
  function loadOrders(){
    $("tab-orders").innerHTML = '<p>Cargando…</p>';
    rest("orders?select=*,order_items(*)&order=created_at.desc&limit=150").then(function(rows){
      var counts = {nuevo:0, confirmado:0, cancelado:0};
      rows.forEach(function(o){ counts[o.status]++; });
      var html = '<div class="filters">' + ["nuevo","confirmado","cancelado","todos"].map(function(f){
        var n = f === "todos" ? rows.length : counts[f];
        return '<button class="tab' + (orderFilter === f ? " on" : "") + '" data-f="' + f + '">' + f.charAt(0).toUpperCase() + f.slice(1) + (f === "nuevo" ? "s" : f === "confirmado" ? "s" : f === "cancelado" ? "s" : "") + ' (' + n + ')</button>';
      }).join("") + '</div>';
      var shown = rows.filter(function(o){ return orderFilter === "todos" || o.status === orderFilter; });
      if (!shown.length) html += '<p style="color:var(--ink-soft)">No hay pedidos en esta lista.</p>';
      shown.forEach(function(o){
        html += '<div class="card order"><div class="order-h"><div><b>Pedido #' + o.id + '</b> <span style="color:var(--ink-soft)">· ' + fmtDate(o.created_at) + '</span></div>' +
          '<div><span class="pill ' + o.status + '">' + o.status + '</span> <b style="margin-left:8px">' + money(o.total) + '</b></div></div><ul>' +
          o.order_items.map(function(i){ return "<li>" + esc(i.name) + " ×" + i.qty + " <span>(" + money(i.qty * i.unit_price) + ")</span></li>"; }).join("") + '</ul><div style="display:flex;gap:8px;flex-wrap:wrap;">' +
          (o.status !== "confirmado" ? '<button class="btn small" data-set="confirmado" data-id="' + o.id + '">Confirmar</button>' : "") +
          (o.status !== "cancelado" ? '<button class="btn small danger" data-set="cancelado" data-id="' + o.id + '">Cancelar y devolver stock</button>' : "") +
          (o.status !== "nuevo" ? '<button class="btn small ghost" data-set="nuevo" data-id="' + o.id + '">Volver a nuevo</button>' : "") + '</div></div>';
      });
      $("tab-orders").innerHTML = html;
      $("tab-orders").querySelectorAll("[data-f]").forEach(function(b){ b.addEventListener("click", function(){ orderFilter = b.dataset.f; loadOrders(); }); });
      $("tab-orders").querySelectorAll("[data-set]").forEach(function(b){ b.addEventListener("click", function(){
        if (b.dataset.set === "cancelado" && !confirm("¿Cancelar el pedido #" + b.dataset.id + "? El stock vuelve a estar disponible.")) return;
        b.disabled = true;
        rest("rpc/set_order_status", {method:"POST", body: JSON.stringify({p_order: Number(b.dataset.id), p_status: b.dataset.set})}).then(loadOrders).catch(function(e){ alert("No se pudo cambiar: " + e.message); b.disabled = false; });
      }); });
    }).catch(function(e){ $("tab-orders").innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
  }

  /* ---------- catalog ---------- */
  function loadCatalogKeepScroll(){ var y = window.scrollY; return loadCatalog().then(function(){ window.scrollTo(0, y); }); }
  function loadCatalog(){
    if ($("tab-catalog").innerHTML === "") $("tab-catalog").innerHTML = '<p>Cargando…</p>';
    return Promise.all([rest("categories?select=*&order=sort.asc"), rest("products?select=*&order=sort.asc,id.asc")]).then(function(r){
      CATS = r[0]; PRODS = r[1]; renderCatalog();
    }).catch(function(e){ $("tab-catalog").innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
  }
  function num(v){ v = String(v).trim(); return v === "" ? null : Number(v); }
  function posOf(str){
    var m = String(str || "50% 50%").match(/([\d.]+)%\s+([\d.]+)%/);
    return m ? {x: Number(m[1]), y: Number(m[2])} : {x: 50, y: 50};
  }
  function mediaHtml(p, url, pos){
    return url ? '<img src="' + esc(url) + '" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:' + esc(pos || "50% 50%") + '">'
               : '<div class="ph" style="background:' + esc(p.color || "#9DB7C4") + '">' + esc(p.name.charAt(0)) + '</div>';
  }
  function prodRow(p){
    var low = p.stock != null && p.stock > 0 && p.stock <= (p.low_stock_at == null ? 3 : p.low_stock_at);
    var chips = (p.active ? "" : '<span class="chip grey">Oculto</span>') +
      (p.stock === 0 ? '<span class="chip warn">Agotado · oculto solo</span>' : low ? '<span class="chip gold">Quedan ' + p.stock + '</span>' : "") +
      (p.max_per_order != null ? '<span class="chip">Máx. ' + p.max_per_order + '</span>' : "") +

  $("save-all").addEventListener("click", function(){

  function resize(file, max){
    return new Promise(function(res, rej){
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function(){
        var s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function(b){ URL.revokeObjectURL(u); b ? res(b) : rej(new Error("imagen inválida")); }, "image/jpeg", 0.85);
      };
      img.onerror = function(){ rej(new Error("No se pudo leer la imagen")); };
      img.src = u;
    });
  }

  /* ---------- stats ---------- */
  var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  var st = {mode:"month", month:null, from:null, to:null};
  function ymd(d){ return d.toISOString().slice(0,10); }
  function arToday(){ return ymd(new Date(Date.now() - 3*3600*1000)); }
  function addDays(str, n){ var d = new Date(str + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return ymd(d); }
  function monthBounds(ym){ var y = +ym.slice(0,4), m = +ym.slice(5,7); return {from: ym + "-01", to: ymd(new Date(Date.UTC(y, m, 0)))}; }
  function addMonths(ym, n){ var d = new Date(Date.UTC(+ym.slice(0,4), +ym.slice(5,7) - 1 + n, 1)); return ymd(d).slice(0,7); }
  function rangeOf(){
    var t = arToday();
    if (st.mode === "today") return {from:t, to:t};
    if (st.mode === "7") return {from:addDays(t,-6), to:t};
    if (st.mode === "30") return {from:addDays(t,-29), to:t};
    if (st.mode === "custom") return {from:st.from || t, to:st.to || t};
    return monthBounds(st.month);
  }
  function dayLabel(d){ return d.slice(8) + "/" + d.slice(5,7); }
  function fetchAll(path){
    var out = [], page = 1000;
    function next(off){
      return api("/rest/v1/" + path, {headers:{"Range-Unit":"items", Range: off + "-" + (off + page - 1)}}).then(function(rows){
        out = out.concat(rows || []);
        return rows && rows.length === page ? next(off + page) : out;
      });
    }
    return next(0);
  }
  function fetchOrders(from, to){
    var a = encodeURIComponent(from + "T00:00:00-03:00"), b = encodeURIComponent(addDays(to, 1) + "T00:00:00-03:00");
    return fetchAll("orders?select=id,created_at,status,total,order_items(name,qty,unit_price)&created_at=gte." + a + "&created_at=lt." + b + "&order=created_at.asc");
  }
  function localDay(iso){ return ymd(new Date(new Date(iso).getTime() - 3*3600*1000)); }
  function summarize(rows){
    var live = rows.filter(function(o){ return o.status !== "cancelado"; });
    var sales = live.reduce(function(a, o){ return a + o.total; }, 0);
    return {orders: live.length, sales: sales, avg: live.length ? Math.round(sales / live.length) : 0,
      units: live.reduce(function(a, o){ return a + o.order_items.reduce(function(x, i){ return x + i.qty; }, 0); }, 0),
      confirmed: live.filter(function(o){ return o.status === "confirmado"; }).length,
      pending: live.filter(function(o){ return o.status === "nuevo"; }).length,
      cancelled: rows.length - live.length, live: live};
  }

    $("tab-stats").innerHTML = statsControls();
    $("st-mode").addEventListener("change", function(){
      st.mode = this.value;
      if (st.mode === "custom" && !st.from){ var r = rangeOf(); st.from = r.from; st.to = r.to; }
      loadStats();
    });
    if ($("st-prev")) $("st-prev").addEventListener("click", function(){ st.month = addMonths(st.month, -1); loadStats(); });
    if ($("st-next")) $("st-next").addEventListener("click", function(){ st.month = addMonths(st.month, 1); loadStats(); });
    ["st-from","st-to"].forEach(function(id){ if ($(id)) $(id).addEventListener("change", function(){
      st.from = $("st-from").value; st.to = $("st-to").value;
      if (st.from && st.to && st.from <= st.to) loadStats();
    }); });
    $("st-csv").addEventListener("click", downloadCsv);

    var r = rangeOf(), prev = null;
    if (st.mode === "month") prev = monthBounds(addMonths(st.month, -1));
    Promise.all([fetchOrders(r.from, r.to), prev ? fetchOrders(prev.from, prev.to) : Promise.resolve(null)]).then(function(res){
      lastRows = res[0]; lastRange = r;
      renderStats(res[0], r, res[1]);
    }).catch(function(e){ $("stats-out").innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
  }
  function renderStats(rows, r, prevRows){
    var S = summarize(rows), html = "";
    var delta = "";
    if (prevRows){
      var P = summarize(prevRows);
      delta = P.sales ? ((S.sales >= P.sales ? "+" : "") + Math.round((S.sales - P.sales) / P.sales * 100) + "% vs mes anterior") : "mes anterior sin ventas";
    }
    html += '<div class="kpis">' +
      '<div class="kpi"><span>Ventas</span><b>' + money(S.sales) + '</b>' + (delta || S.units + " unidades") + '</div>' +
      '<div class="kpi"><span>Pedidos</span><b>' + S.orders + '</b>' + S.confirmed + ' confirmados · ' + S.pending + ' por confirmar</div>' +
      '<div class="kpi"><span>Ticket promedio</span><b>' + money(S.avg) + '</b>' + S.units + ' unidades vendidas</div>' +
      '<div class="kpi"><span>Cancelados</span><b>' + S.cancelled + '</b>no suman a las ventas</div></div>';

    var days = {}, keys = [], d = r.from;
    while (d <= r.to && keys.length < 400){ keys.push(d); days[d] = {sales:0, orders:0}; d = addDays(d, 1); }
    S.live.forEach(function(o){ var k = localDay(o.created_at); if (days[k]){ days[k].sales += o.total; days[k].orders++; } });
    var grouped = keys.length > 62, series = [];
    if (grouped){
      var byM = {}; keys.forEach(function(k){ var m = k.slice(0,7); byM[m] = byM[m] || {sales:0, orders:0}; byM[m].sales += days[k].sales; byM[m].orders += days[k].orders; });
      Object.keys(byM).forEach(function(m){ series.push({l: MESES[+m.slice(5,7) - 1].slice(0,3) + " " + m.slice(2,4), v: byM[m].sales, n: byM[m].orders}); });
    } else keys.forEach(function(k){ series.push({l: dayLabel(k), v: days[k].sales, n: days[k].orders}); });
    var mx = Math.max.apply(null, series.map(function(x){ return x.v; }).concat([1]));
    html += '<div class="card"><h3>Ventas por ' + (grouped ? "mes" : "día") + '</h3>' + (S.orders ? series.map(function(x){
      return '<div class="bar"><span class="l">' + x.l + '</span><span class="t"><i style="width:' + Math.round(x.v / mx * 100) + '%"></i></span><span class="v">' + money(x.v) + (x.n ? ' <small style="color:var(--ink-soft)">(' + x.n + ')</small>' : "") + '</span></div>';
    }).join("") : '<p style="color:var(--ink-soft)">No hay ventas en este período.</p>') + '</div>';

    var pm = {};
    S.live.forEach(function(o){ o.order_items.forEach(function(i){ var x = pm[i.name] = pm[i.name] || {u:0, v:0}; x.u += i.qty; x.v += i.qty * i.unit_price; }); });
    var plist = Object.keys(pm).map(function(k){ return {n:k, u:pm[k].u, v:pm[k].v}; }).sort(function(a, b){ return b.u - a.u; });
    var pmx = Math.max.apply(null, plist.map(function(x){ return x.u; }).concat([1]));
    html += '<div class="card"><h3>Lo más pedido</h3>' + (plist.length ? plist.slice(0, 20).map(function(x){
      return '<div class="bar"><span class="l wide">' + esc(x.n) + '</span><span class="t"><i style="width:' + Math.round(x.u / pmx * 100) + '%;background:var(--gold)"></i></span><span class="v">' + x.u + ' u. · ' + money(x.v) + '</span></div>';
    }).join("") : '<p style="color:var(--ink-soft)">No hay pedidos en este período.</p>') + '</div>';
    html += '<p style="color:var(--ink-soft);font-size:.8rem">Las ventas cuentan pedidos nuevos y confirmados; los cancelados no suman. Los días van de 00:00 a 23:59, hora de Argentina.</p>';
    $("stats-out").innerHTML = html;
  }
  function downloadCsv(){
    if (!lastRange) return;
    function q(v){ return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
    var lines = ["Fecha,Hora,Pedido,Estado,Total,Detalle"];
    lastRows.forEach(function(o){
      var dt = new Date(new Date(o.created_at).getTime() - 3*3600*1000).toISOString();
      lines.push([q(dt.slice(0,10)), q(dt.slice(11,16)), o.id, q(o.status), o.total, q(o.order_items.map(function(i){ return i.name + " x" + i.qty; }).join(" | "))].join(","));
    });
    var blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "pedidos_" + (st.mode === "month" ? st.month : lastRange.from + "_a_" + lastRange.to) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------- boot ---------- */
  if (session && session.access){ checkAdmin().catch(function(){ try { localStorage.removeItem(SESSION_KEY); } catch(e){} }); }
})();
</script>
